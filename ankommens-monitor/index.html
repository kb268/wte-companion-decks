<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Ankommens-Monitor 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{
    --navy:#1B2352; --royal:#2B3B99; --royal2:#3A4CC0; --deep:#16205C;
    --yellow:#E1F300; --yellow-dim:rgba(225,243,0,.13);
    --text:#FFFFFF; --dim:rgba(255,255,255,.68); --faint:rgba(255,255,255,.5);
    --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.22); --field:rgba(11,17,55,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 700px at 88% -10%, var(--royal2) 0%, transparent 60%),
      radial-gradient(1000px 800px at 0% 110%, var(--deep) 0%, transparent 55%),
      var(--royal);
    color:var(--text);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.55;
    min-height:100vh; padding:0 16px 56px; position:relative;
  }
  .dots{position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.09) 1.5px, transparent 1.5px);
    background-size:40px 40px;
    mask-image:linear-gradient(160deg, transparent 45%, rgba(0,0,0,.9) 95%);
    -webkit-mask-image:linear-gradient(160deg, transparent 45%, rgba(0,0,0,.9) 95%)}
  .shell{max-width:620px;margin:0 auto;position:relative}

  .protobar{background:rgba(9,13,45,.55);color:var(--yellow);margin:0 -16px;
    padding:8px 16px;text-align:center;
    font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}

  .brand{display:flex;align-items:center;gap:12px;margin:30px 0 22px;
    font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
  .brand .bar{width:34px;height:5px;background:var(--yellow);border-radius:3px;flex-shrink:0}

  .progress{height:6px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden}
  .progress .fill{height:100%;background:var(--yellow);border-radius:3px;width:0%;transition:width .25s ease}
  @media (prefers-reduced-motion: reduce){.progress .fill{transition:none}}
  .counter{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin-top:8px;min-height:16px;font-variant-numeric:tabular-nums}

  .card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;
    padding:30px 26px 26px;margin-top:14px;box-shadow:0 24px 60px rgba(8,12,45,.35)}
  .block-tag{display:flex;align-items:center;gap:10px;
    font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
    color:var(--yellow);margin-bottom:14px}
  .block-tag::before{content:"";width:22px;height:4px;background:var(--yellow);border-radius:2px}
  h1,.qtext{font-weight:800;font-size:clamp(23px,5vw,30px);line-height:1.2;
    letter-spacing:-.015em;text-wrap:balance;margin-bottom:8px}
  .mark{position:relative;white-space:nowrap}
  .mark svg{position:absolute;left:0;bottom:-7px;width:100%;height:14px;pointer-events:none}
  .hint{font-size:14px;color:var(--dim);margin-bottom:16px}

  .chips{display:flex;flex-direction:column;gap:9px;margin:18px 0 6px}
  .chip{display:block;width:100%;text-align:left;background:rgba(255,255,255,.045);
    border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;
    font:inherit;font-size:15.5px;font-weight:500;color:var(--text);cursor:pointer}
  .chip:hover{border-color:rgba(225,243,0,.65)}
  .chip[aria-pressed="true"]{background:var(--yellow-dim);border-color:var(--yellow);font-weight:700}
  .chip:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

  .numwrap{display:flex;align-items:center;gap:14px;margin:24px 0 10px}
  .stepbtn{width:50px;height:50px;border-radius:50%;font-size:24px;font-weight:800;
    background:rgba(255,255,255,.08);border:2px solid var(--line);color:var(--text);cursor:pointer}
  .stepbtn:hover{border-color:var(--yellow);color:var(--yellow)}
  .stepbtn:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  input[type=number]{width:130px;height:52px;text-align:center;font-family:inherit;
    font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;border-radius:12px;
    border:1.5px solid var(--line);background:var(--field);color:var(--text)}
  input[type=number]:focus{outline:2px solid var(--yellow);outline-offset:1px}

  .sliderwrap{margin:28px 0 8px}
  .sval{font-size:46px;font-weight:900;color:var(--yellow);text-align:center;
    margin-bottom:16px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .sval small{font-size:14px;font-weight:600;color:var(--dim);display:block;
    letter-spacing:.03em;margin-top:2px}
  input[type=range]{width:100%;accent-color:var(--yellow);height:36px;cursor:pointer}
  input[type=range]:focus-visible{outline:2px solid var(--yellow);outline-offset:4px;border-radius:4px}
  .slabels{display:flex;justify-content:space-between;font-size:11px;font-weight:700;
    color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}

  input[type=email]{width:100%;height:50px;padding:0 15px;font:inherit;font-size:15.5px;
    border-radius:12px;border:1.5px solid var(--line);background:var(--field);color:var(--text);margin:6px 0 16px}
  input[type=email]::placeholder{color:var(--faint)}
  input[type=email]:focus{outline:2px solid var(--yellow);outline-offset:1px}
  .checkrow{display:flex;gap:11px;align-items:flex-start;margin:13px 0;cursor:pointer;font-size:14.5px;color:var(--text)}
  .checkrow input{width:20px;height:20px;margin-top:2px;accent-color:var(--yellow);flex-shrink:0;cursor:pointer}

  .nav{display:flex;gap:10px;justify-content:space-between;margin-top:28px}
  .btn{font:inherit;font-size:15.5px;font-weight:800;padding:14px 28px;cursor:pointer;border-radius:16px}
  .btn:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
  .btn.primary{background:var(--yellow);color:var(--navy);border:none}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--yellow);color:var(--yellow)}

  .fineprint{font-size:12.5px;color:var(--faint);margin-top:20px;line-height:1.5}
  .endnote{background:var(--yellow-dim);border:1.5px solid rgba(225,243,0,.55);border-radius:14px;
    padding:13px 15px;font-size:14px;margin-top:20px;color:var(--text)}
  .sitefoot{text-align:center;font-size:12px;font-weight:600;color:var(--faint);
    margin-top:34px;letter-spacing:.04em}
</style>

<div class="dots"></div>
<div class="shell">
  <div class="brand"><span class="bar"></span>WTE Companion · Puls-Check</div>
  <div class="progress" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <div class="counter" id="counter"></div>
  <div class="card" id="screen" aria-live="polite"></div>
  <div class="sitefoot">Eine Erhebung von WTE Companion · wte-companion.com</div>
</div>

<script>
(function(){
  var SWOOSH = '<svg viewBox="0 0 600 24" preserveAspectRatio="none" aria-hidden="true"><path d="M4 18 C150 6, 420 4, 596 12" stroke="#E1F300" stroke-width="11" fill="none" stroke-linecap="round"/></svg>';
  var SUBMIT_URL = "https://script.google.com/macros/s/AKfycbw6HSQPWFHNrhv8rQ5q0IQy3V34ZXmU5zgKt3iHPx7MKi31fNWz2UXkubn7tMRAuBEX/exec";

  var QUESTIONS = [
    {block:"Block A · Über Ihr Unternehmen", type:"select",
     text:"In welcher Branche ist Ihr Unternehmen tätig?",
     opts:["Gesundheit & Pflege","Handwerk & Bau","IT & Engineering","Logistik & Verkehr","Hotellerie & Gastronomie","Industrie & Produktion","Öffentlicher Sektor","Andere"]},
    {block:"Block A · Über Ihr Unternehmen", type:"select",
     text:"Wie viele Mitarbeiter hat Ihr Unternehmen?",
     opts:["Unter 50","50 bis 99","100 bis 249","250 bis 999","1.000 und mehr"]},
    {block:"Block A · Über Ihr Unternehmen", type:"select",
     text:"Was ist Ihre Rolle?",
     opts:["Geschäftsführung","HR-Leitung","Recruiting","Integration / Onboarding","Andere"]},
    {block:"Block B · Ihre Zahlen", type:"number",
     text:"Wie viele Fachkräfte aus dem Ausland haben Sie in den letzten 12 Monaten eingestellt?",
     hint:"Eine ehrliche Schätzung reicht völlig."},
    {block:"Block B · Ihre Zahlen", type:"number",
     text:"Wie viele planen Sie in den nächsten 12 Monaten?"},
    {block:"Block B · Ihre Zahlen", type:"slider", min:0, max:30, start:5, unit:"Personentage", maxPlus:true,
     text:"Wie viel interner Aufwand steckt in einer internationalen Einstellung, von Zusage bis „im Alltag angekommen“?",
     hint:"Behördengänge, Konto, Versicherungen, Wohnung, interne Abstimmung: alles zusammengerechnet."},
    {block:"Block C · Status quo", type:"multi",
     text:"Wer kümmert sich heute um das Ankommen?",
     hint:"Behörden, Konto, Versicherungen, Wohnung. Mehrfachauswahl möglich.",
     opts:["Eigene HR","Kollegen aus dem Fachbereich","Externe Relocation-Agentur","Die Vermittlungsagentur übernimmt das","Eine App bzw. digitale Plattform","Die Fachkraft selbst","Nicht strukturiert geregelt"]},
    {block:"Block C · Status quo", type:"select",
     text:"Nutzen Sie dafür bereits eine App oder digitale Plattform?",
     opts:["Ja, im Einsatz","In Auswahl bzw. geplant","Nein, aber offen dafür","Nein, kein Bedarf"]},
    {block:"Block C · Status quo", type:"multi", max:3,
     text:"Was kostet Sie am meisten Zeit und Nerven?",
     hint:"Bitte maximal 3 auswählen.",
     opts:["Visum & Behördentermine","Wohnungssuche","Bankkonto & Versicherungen","Anerkennung von Abschlüssen","Sprache & Alltag","Familiennachzug","Frühe Abbrüche bzw. Kündigungen","Interne Koordination"]},
    {block:"Block D · Bedarf", type:"select",
     text:"Wie oft ist eine internationale Einstellung in den ersten 12 Monaten gescheitert?",
     hint:"Abbruch, Rückkehr oder Kündigung.",
     opts:["Noch nie","Vereinzelt","Spürbar oft","Kann ich nicht einschätzen"]},
    {block:"Block D · Bedarf", type:"slider", min:0, max:10, start:5, unit:"0 = gar nicht relevant · 10 = sehr relevant",
     text:"Angenommen, Bankkonto, Krankenversicherung, Haftpflicht und Mobilfunk wären in unter 10 Minuten pro Schritt erledigt und Ihre Fachkraft würde digital durch alle Ankommens-Schritte geführt: Wie relevant wäre das für Ihr Unternehmen?"},
    {block:"Block E · Abschluss", type:"select",
     text:"Was wäre Ihnen ein komplett organisiertes Ankommen pro Fachkraft wert?",
     opts:["Unter 250 €","250 bis 500 €","500 bis 1.000 €","Über 1.000 €","Kann ich nicht einschätzen"]},
    {block:"Fast geschafft", type:"optin",
     text:"Möchten Sie den Benchmark-Report zuerst bekommen?",
     hint:"Alles auf dieser Seite ist freiwillig. Ohne Angaben bleibt Ihre Teilnahme anonym."}
  ];

  var state = { step:-1, answers:{} };
  var screen = document.getElementById("screen");
  var fill = document.getElementById("fill");
  var counter = document.getElementById("counter");

  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

  function render(){
    var total = QUESTIONS.length;
    if(state.step === -1){
      fill.style.width = "0%"; counter.textContent = "";
      screen.innerHTML =
        '<div class="block-tag">Die Erhebung, die niemand macht</div>' +
        '<h1>Ankommens-Monitor <span class="mark">2026' + SWOOSH + '</span></h1>' +
        '<p class="hint" style="font-size:15.5px;color:var(--text)">Wie holen deutsche Arbeitgeber internationale Fachkräfte an Bord? 12 Fragen, rund 3 Minuten, alles anklickbar. Teilnehmer erhalten den Benchmark-Report vor der Veröffentlichung.</p>' +
        '<div class="nav"><span></span><button class="btn primary" data-act="next">Los geht’s</button></div>' +
        '<p class="fineprint">Diese Befragung ist ohne Angabe persönlicher Daten möglich. Verantwortlich: WTE Companion (Kontakt: kb@wte-companion.com). Eine E-Mail-Adresse erfragen wir nur, wenn Sie den Ergebnis-Report erhalten oder kontaktiert werden möchten; Widerruf jederzeit per Mail. Antworten speichern wir vertraulich in unserem Google Workspace und löschen oder anonymisieren sie spätestens am 31.03.2027.</p>';
      return;
    }
    if(state.step >= total){
      fill.style.width = "100%"; counter.textContent = "Fertig";
      screen.innerHTML =
        '<div class="block-tag">Danke!</div>' +
        '<h1>Das <span class="mark">war’s' + SWOOSH + '</span> schon.</h1>' +
        '<p class="hint" style="font-size:15.5px;color:var(--text)">Ihre Antworten sind gespeichert, danke für Ihre 3 Minuten. Der Benchmark-Report geht vor der Veröffentlichung an alle Teilnehmer, die eine E-Mail-Adresse angegeben haben.</p>';
      return;
    }
    var q = QUESTIONS[state.step];
    var pct = Math.round((state.step / total) * 100);
    fill.style.width = pct + "%";
    counter.textContent = (q.type === "optin") ? "Fast geschafft" : "Frage " + (state.step+1) + " von " + (total-1);

    var h = '<div class="block-tag">' + esc(q.block) + '</div>' +
            '<div class="qtext">' + esc(q.text) + '</div>' +
            (q.hint ? '<p class="hint">' + esc(q.hint) + '</p>' : '');
    var a = state.answers[state.step];

    if(q.type === "select" || q.type === "multi"){
      h += '<div class="chips">';
      q.opts.forEach(function(o,i){
        var on = q.type==="select" ? a===i : (a||[]).indexOf(i)>=0;
        h += '<button class="chip" aria-pressed="'+on+'" data-opt="'+i+'">'+esc(o)+'</button>';
      });
      h += '</div>';
    } else if(q.type === "number"){
      var v = (a===undefined) ? "" : a;
      h += '<div class="numwrap">' +
           '<button class="stepbtn" data-stp="-1" aria-label="Weniger">−</button>' +
           '<input type="number" id="numin" min="0" max="99999" inputmode="numeric" value="'+v+'" placeholder="0">' +
           '<button class="stepbtn" data-stp="1" aria-label="Mehr">+</button>' +
           '</div>';
    } else if(q.type === "slider"){
      var sv = (a===undefined) ? q.start : a;
      var lbl = (q.maxPlus && sv>=q.max) ? q.max+"+" : sv;
      h += '<div class="sliderwrap">' +
           '<div class="sval" id="sval">'+lbl+'<small>'+esc(q.unit)+'</small></div>' +
           '<input type="range" id="rng" min="'+q.min+'" max="'+q.max+'" step="1" value="'+sv+'" aria-label="'+esc(q.text)+'">' +
           '<div class="slabels"><span>'+q.min+'</span><span>'+(q.maxPlus? q.max+"+" : q.max)+'</span></div>' +
           '</div>';
    } else if(q.type === "optin"){
      var o = a || {mail:"",c1:false,c2:false};
      h += '<label style="font-weight:700;font-size:14.5px" for="mailin">Wohin dürfen wir den Benchmark-Report schicken, bevor er veröffentlicht wird?</label>' +
           '<input type="email" id="mailin" placeholder="ihre@firma.de" value="'+esc(o.mail)+'" autocomplete="off">' +
           '<label class="checkrow"><input type="checkbox" id="c1" '+(o.c1?"checked":"")+'> <span>WTE Companion darf mich per E-Mail zu den Studienergebnissen und zur Companion-App kontaktieren. Widerruf jederzeit möglich.</span></label>' +
           '<label class="checkrow"><input type="checkbox" id="c2" '+(o.c2?"checked":"")+'> <span>Ich stehe für ein 15-Minuten-Gespräch zu den Ergebnissen zur Verfügung.</span></label>' +
           '<input type="text" id="website" value="" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">';
    }

    var last = (state.step === total-1);
    h += '<div class="nav">' +
         '<button class="btn ghost" data-act="back">Zurück</button>' +
         '<button class="btn primary" data-act="next">' + (last ? "Absenden" : "Weiter") + '</button>' +
         '</div>';
    screen.innerHTML = h;

    var rng = document.getElementById("rng");
    if(rng){
      rng.addEventListener("input", function(){
        var v = parseInt(rng.value,10);
        state.answers[state.step] = v;
        var lbl = (q.maxPlus && v>=q.max) ? q.max+"+" : v;
        document.getElementById("sval").innerHTML = lbl + "<small>"+esc(q.unit)+"</small>";
      });
      if(a===undefined) state.answers[state.step] = q.start;
    }
  }

  screen.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    var q = QUESTIONS[state.step];

    if(b.dataset.opt !== undefined){
      var i = parseInt(b.dataset.opt,10);
      if(q.type==="select"){
        state.answers[state.step] = i;
        render();
        setTimeout(function(){ state.step++; render(); window.scrollTo(0,0); }, 180);
      } else {
        var arr = state.answers[state.step] || [];
        var at = arr.indexOf(i);
        if(at>=0) arr.splice(at,1);
        else if(!q.max || arr.length < q.max) arr.push(i);
        state.answers[state.step] = arr;
        render();
      }
      return;
    }
    if(b.dataset.stp){
      var inp = document.getElementById("numin");
      var v = parseInt(inp.value,10); if(isNaN(v)) v = 0;
      v = Math.max(0, v + parseInt(b.dataset.stp,10));
      inp.value = v; state.answers[state.step] = v;
      return;
    }
    if(b.dataset.act === "next"){
      if(q && q.type === "optin"){ submitAnswers(b); return; }
      saveFree();
      state.step++; render(); window.scrollTo(0,0);
    } else if(b.dataset.act === "back"){
      saveFree();
      state.step--; render(); window.scrollTo(0,0);
    } else if(b.dataset.act === "restart"){
      state.step = -1; state.answers = {}; render(); window.scrollTo(0,0);
    }
  });

  screen.addEventListener("input", function(e){
    if(e.target.id === "numin"){
      var v = parseInt(e.target.value,10);
      state.answers[state.step] = isNaN(v) ? undefined : v;
    }
  });

  function buildPayload(){
    var A = state.answers;
    function lbl(i){ var qq=QUESTIONS[i]; return (A[i]===undefined || !qq.opts) ? "" : (qq.opts[A[i]] || ""); }
    function multi(i){ var qq=QUESTIONS[i]; return (A[i]||[]).map(function(x){ return qq.opts[x]; }).join(", "); }
    var o = A[12] || {};
    var aufw = A[5];
    return {
      branche: lbl(0), groesse: lbl(1), rolle: lbl(2),
      eingestellt: A[3], geplant: A[4],
      aufwand: (aufw===undefined) ? "" : (aufw>=30 ? "30+" : String(aufw)),
      heute: multi(6), app: lbl(7), schmerz: multi(8),
      gescheitert: lbl(9), relevanz: A[10], wert: lbl(11),
      mail: o.mail || "", c1: !!o.c1, c2: !!o.c2,
      website: (document.getElementById("website")||{}).value || ""
    };
  }

  function submitAnswers(btn){
    saveFree();
    btn.disabled = true; btn.textContent = "Wird gesendet…";
    var old = document.getElementById("suberr"); if(old) old.remove();
    fetch(SUBMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(buildPayload())
    }).then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.ok){ state.step++; render(); window.scrollTo(0,0); }
        else { throw new Error("nok"); }
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = "Absenden";
        var d = document.createElement("div");
        d.id = "suberr"; d.className = "endnote";
        d.textContent = "Das Senden hat gerade nicht geklappt. Bitte versuchen Sie es gleich noch einmal, Ihre Angaben bleiben erhalten.";
        var nav = btn.parentNode;
        nav.parentNode.insertBefore(d, nav);
      });
  }

  function saveFree(){
    var q = QUESTIONS[state.step];
    if(q && q.type === "optin"){
      state.answers[state.step] = {
        mail: (document.getElementById("mailin")||{}).value || "",
        c1: !!(document.getElementById("c1")||{}).checked,
        c2: !!(document.getElementById("c2")||{}).checked
      };
    }
  }

  render();
})();
</script>

</body>
</html>
